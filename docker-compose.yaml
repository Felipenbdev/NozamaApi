services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
  backend:
    build: .
    container_name: nozama_backend
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - SPRING_MONGODB_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
volumes:
  mongo-data: